name: Database backup

# Nightly logical backup of the production database, kept OFF Neon: pg_dump
# over a direct connection, encrypted with a passphrase, stored as a workflow
# artifact. Protects against what Neon's point-in-time restore cannot: the
# project being deleted, or a problem noticed after the restore window.
#
# Setup (once) — repository Settings → Secrets and variables → Actions:
#   BACKUP_DATABASE_URL  the production DIRECT (non-pooled) Postgres URL
#   BACKUP_PASSPHRASE    a long random passphrase; store it in your password
#                        manager too — without it the backups cannot be opened
# Restore: see DEPLOY.md → "Backups & restore".

on:
  schedule:
    - cron: '30 21 * * *' # 03:30 in Dhaka, after the evening auctions
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the secrets are set
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DIRECT_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the BACKUP_DATABASE_URL and BACKUP_PASSPHRASE repository secrets (see .github/workflows/backup.yml)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pg_dump must be the same or a newer major version than the server (Neon: 16/17).
      - name: Install the PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump the database
        env:
          DIRECT_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: node scripts/backup-db.mjs

      # The dump holds personal data (names, phone numbers, emails): only the
      # encrypted copy leaves this runner.
      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          shopt -s nullglob
          dumps=(backups/*.dump)
          if [ ${#dumps[@]} -ne 1 ]; then echo "::error::expected one dump, found ${#dumps[@]}"; exit 1; fi
          f="${dumps[0]}"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$f.gpg" "$f"
          shred -u "$f"
          ls -lh backups/

      - uses: actions/upload-artifact@v4
        with:
          name: neelamghor-db-${{ github.run_id }}
          path: backups/*.gpg
          retention-days: 14
          if-no-files-found: error
          compression-level: 0 # already compressed and encrypted
